name: Release

# 推送 v* 标签（例如 git tag v1.0.1 && git push origin v1.0.1）时自动打包并创建 Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 运行测试
        run: python -m unittest discover -s tests
      - name: 检查版本号与标签一致
        run: |
          VERSION=$(python3 run.py version)
          [ "v$VERSION" = "$GITHUB_REF_NAME" ] || { echo "app/core.py 里的 VERSION=$VERSION 和标签 $GITHUB_REF_NAME 不一致"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: 打包安装包
        run: |
          mkdir -p dist
          git archive --format=tar --prefix="jiaxiao-$VERSION/" HEAD \
            run.py app templates static tests deploy install.sh uninstall.sh \
            Dockerfile docker-compose.yml .dockerignore README.md LICENSE CHANGELOG.md \
            | gzip -9 > "dist/jiaxiao-$VERSION.tar.gz"
          (cd dist && sha256sum "jiaxiao-$VERSION.tar.gz" > "jiaxiao-$VERSION.tar.gz.sha256")
          tar -tzf "dist/jiaxiao-$VERSION.tar.gz" | head -50
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "驾校招生业务系统 $GITHUB_REF_NAME" \
            --notes "安装方法见 README。下载 jiaxiao-$VERSION.tar.gz，解压后运行 sudo bash install.sh。"
